{% extends "base.html" %}

{% block title %}Advanced Lipids - Pillar 5{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header" style="background: linear-gradient(135deg, #16a085 0%, #27ae60 100%); color: white;">
            <h4><i class="bi bi-activity"></i> Advanced Lipids (2 points)</h4>
        </div>
        <div class="card-body">
            <form method="POST">
                <!-- ApoB -->
                <div class="mb-4">
                    <label class="form-label"><strong>ApoB (Apolipoprotein B)</strong></label>
                    <div class="input-group">
                        <input type="number" step="0.1" class="form-control" name="apob" 
                               value="{{ pillar5.apob if pillar5.apob else '' }}" placeholder="Enter ApoB">
                        <span class="input-group-text">mg/dL</span>
                    </div>
                    <small class="text-muted">Optimal: &lt;80 | Good: 80-100 | Acceptable: 100-120 | High: &gt;120</small>
                </div>

                <!-- Lp(a) -->
                <div class="mb-4">
                    <label class="form-label"><strong>Lp(a) (Lipoprotein a)</strong></label>
                    <div class="input-group">
                        <input type="number" step="0.1" class="form-control" name="lp_a" 
                               value="{{ pillar5.lp_a if pillar5.lp_a else '' }}" placeholder="Enter Lp(a)">
                        <span class="input-group-text">mg/dL</span>
                    </div>
                    <small class="text-muted">Optimal: &lt;30 | Good: 30-50 | Elevated: 50-100 | Very High: &gt;100</small>
                </div>

                <!-- Buttons -->
                <div class="d-flex gap-2">
                    <button type="submit" class="btn" style="background-color: #16a085; color: white;">
                        <i class="bi bi-save"></i> Save Results
                    </button>
                    <a href="{{ url_for('pillar5.overview', assessment_id=assessment.id) }}" class="btn btn-secondary">
                        <i class="bi bi-arrow-left"></i> Back
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
