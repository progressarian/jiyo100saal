{% extends "base.html" %}

{% block title %}Organ Imaging - Pillar 5{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header" style="background: linear-gradient(135deg, #16a085 0%, #27ae60 100%); color: white;">
            <h4><i class="bi bi-body-text"></i> Organ Imaging (2 points)</h4>
        </div>
        <div class="card-body">
            <form method="POST">
                <!-- Abdomen -->
                <div class="mb-4">
                    <label class="form-label"><strong>Abdomen Imaging (Ultrasound/CT)</strong></label>
                    <select class="form-select" name="abdomen_imaging" required>
                        <option value="">Select result...</option>
                        <option value="normal" {% if pillar5.abdomen_imaging == 'normal' %}selected{% endif %}>Normal</option>
                        <option value="abnormal" {% if pillar5.abdomen_imaging == 'abnormal' %}selected{% endif %}>Abnormal findings</option>
                        <option value="notPerformed" {% if pillar5.abdomen_imaging == 'notPerformed' %}selected{% endif %}>Not Performed</option>
                    </select>
                </div>

                <!-- Chest -->
                <div class="mb-4">
                    <label class="form-label"><strong>Chest Imaging (X-ray/CT)</strong></label>
                    <select class="form-select" name="chest_imaging" required>
                        <option value="">Select result...</option>
                        <option value="normal" {% if pillar5.chest_imaging == 'normal' %}selected{% endif %}>Normal</option>
                        <option value="abnormal" {% if pillar5.chest_imaging == 'abnormal' %}selected{% endif %}>Abnormal findings</option>
                        <option value="notPerformed" {% if pillar5.chest_imaging == 'notPerformed' %}selected{% endif %}>Not Performed</option>
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn" style="background-color: #16a085; color: white;">
                        <i class="bi bi-save"></i> Save Results
                    </button>
                    <a href="{{ url_for('pillar5.overview', assessment_id=assessment.id) }}" class="btn btn-secondary">
                        <i class="bi bi-arrow-left"></i> Back
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
